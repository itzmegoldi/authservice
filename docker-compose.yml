services:
  backend-api:
    build:
      context: .
      dockerfile: build/Dockerfile.api
    container_name: auth-backend-api
    env_file:
      - .env
    volumes:
      - auth-db:/app/data
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - authnet

  backend-worker:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
    container_name: auth-backend-worker
    env_file:
      - .env
    volumes:
      - auth-db:/app/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
    networks:
      - authnet

  frontend:
    build:
      context: ../auth-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /v1/api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    container_name: auth-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    networks:
      - authnet

  redis:
    image: redis:7.4-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - authnet

  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-authdb}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authnet

networks:
  authnet:
    driver: bridge

volumes:
  auth-db:
  redis-data:
  postgres-data:
